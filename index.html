<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPUB Cắt Chương</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<meta name="theme-color" content="#4f46e5">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header><div class="bar"><div class="logo">✂️ EPUB Cắt Chương</div><span class="meta">Chạy offline</span></div></header>
<main>
<section class="card" id="s1">
  <h2><span class="step">1</span>Chọn file truyện</h2>
  <div class="drop" id="drop"><b>📚</b>Bấm để chọn file .epub<br><small>hoặc kéo thả vào đây</small></div>
  <input type="file" id="file" accept=".epub,application/epub+zip" class="hide">
</section>

<section class="card hide" id="s2">
  <div class="book"><div class="cover" id="cv">K</div>
    <div><h3 id="bt"></h3><div class="meta" id="bm"></div></div>
    <button class="btn" style="margin-left:auto" id="change">Đổi file</button></div>
</section>

<section class="card hide" id="s3">
  <h2><span class="step">2</span>Chọn khoảng chương</h2>
  <div class="range">
    <div><label>Từ chương</label><input type="number" id="a" min="1" value="1"></div>
    <div><label>Đến chương</label><input type="number" id="b" min="1" value="100"></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="err" id="err"></div>
  <div class="preview" id="pv"></div>
  <details style="margin-top:12px"><summary class="meta" style="cursor:pointer">Xem danh sách chương (chạm để chọn đầu/cuối)</summary>
    <input id="q" placeholder="Tìm chương…" style="margin-top:8px">
    <div class="list" id="list"></div></details>
</section>

<section class="card hide" id="s4">
  <h2><span class="step">3</span>Cắt file</h2>
  <button class="btn p big" id="cut">✂️ Cắt &amp; tạo file</button>
</section>

<section class="card result hide" id="s5">
  <h2>✅ Đã cắt xong</h2>
  <div class="file"><div class="ic">📘</div><div><b id="fn"></b><div class="meta" id="fm"></div></div></div>
  <div class="row">
    <button class="btn p" id="share" style="flex:1">📤 Chia sẻ (Zalo/Facebook)</button>
    <button class="btn" id="save" style="flex:1">💾 Lưu về máy</button>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn" id="again">Cắt đoạn khác từ truyện này</button></div>
</section>
<p class="note">File truyện được xử lý ngay trên máy, không tải lên đâu cả. File gốc không bị sửa.</p>
</main>
<div class="toast" id="toast"></div>
<script src="assets/js/jszip.min.js"></script>
<script src="assets/js/epub-read.js"></script>
<script src="assets/js/epub-cut.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
